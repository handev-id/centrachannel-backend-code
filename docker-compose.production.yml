services:
  app:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: centrachannel-production
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 127.0.0.1
      PORT: "4000"
      ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:4000/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
