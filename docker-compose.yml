services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: centrachannel-staging
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:4001/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
